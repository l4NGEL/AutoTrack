source: 0                     # 0 = webcam, or path to video file
model_weights: yolov8n.pt
conf_threshold: 0.35
classes: null                 # null = all classes, or list of class ids e.g. [0, 2, 8]

tracker:
  type: adaptive               # "iou" (baseline ByteTracker) veya "adaptive" (Re-ID + Kalman + adaptif agirlik)
  track_thresh: 0.5
  track_buffer: 30
  match_thresh: 0.8            # sadece type: iou icin kullanilir
  adaptive:                    # sadece type: adaptive icin kullanilir
    match_thresh: 0.3          # min birlesik skor (IOU+hareket+ReID), altinda eslesme reddedilir
    weight_mode: adaptive      # "adaptive" (dinamik) veya "fixed" (ablation icin sabit)
    base_weights: [0.4, 0.3, 0.3]  # alpha (IOU), beta (hareket), gamma (Re-ID)
    embedding_momentum: 0.9    # track embedding'i EMA ile guncellenir
    reid_recovery_enabled: true    # silinen track'leri bir sure "kayip galeri"de tutup Re-ID ile geri canlandir
    reid_recovery_window: 60   # kare -- silindikten sonra kimlik ne kadar sure aday kalir
    reid_recovery_thresh: 0.75 # ham cosine benzerligi -- kurtarma icin gereken min esik (match_thresh'ten siki)

reid:
  enabled: true
  model_name: osnet_x1_0
  checkpoint_path: null        # null = ImageNet backbone (zayif embedding, ama repo klonlanir klonlanmaz calisir).
                                # Faz 2'yi calistirdiysaniz (bkz. README "Testler"):
                                # checkpoints/osnet_market1501/model/model.pth.tar-15
                                # checkpoint'i gitignore'lu oldugu icin varsayilan olarak
                                # buraya sabitlenmedi -- repo'yu klonlayan biri onu
                                # kendisi uretmeden main.py'nin patlamamasi icin.
  input_size: [256, 128]

zones:
  - name: hassas_bolge_1
    polygon: [[400, 200], [900, 200], [900, 600], [400, 600]]

priority_weights:
  speed: 0.4
  zone: 0.4
  dwell_time: 0.2

output:
  save_video: false
  output_path: data/output.mp4
  log_path: data/logs/session.jsonl
